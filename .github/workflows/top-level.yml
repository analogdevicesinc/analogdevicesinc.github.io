on:
  push:
    branches:
      - main
      - staging/*
  pull_request:

jobs:
  build-doc:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: analogdevicesinc/doctools
        path: doctools
    - name: Install pip packages
      working-directory: docs
      run: |
        pip install pip --upgrade
        pip install -r requirements.txt --upgrade

    - name: Install bundler dependencies
      run: >-
        npm install
        rollup
        @rollup/plugin-terser
        @rollup/plugin-alias
        @rollup/plugin-node-resolve
        sass
        gsap

    - name: Bundle web scripts
      run: >-
        node_modules/.bin/rollup -c
        scripts/rollup.config.mjs
        --environment DOCTOOLS_PATH:./doctools

    - name: Bundle web styles
      run: >-
        node_modules/.bin/sass
        --load-path ./doctools/adi_doctools/theme/harmonic/style
        style/bundle.scss:docs/sources/custom.min.css
        --style compressed

    - name: Build doc
      working-directory: docs
      run: |
        make html SPHINXOPTS="-W --keep-going"

    - name: Generate sitemap
      working-directory: docs
      run: |
        curl -fsSL https://analogdevicesinc.github.io/doctools/metadata.json |
          jq -r '.repotoc[] | select(.visibility == "public") | .url_doc' |
          jq -R -s 'split("\n") | map(select(length > 0))' |
          jq -r '"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n" + (map("  <url><loc>\(.)/</loc></url>") | join("\n")) + "\n</urlset>"' \
          > _build/html/sitemap.xml

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_build/html

  deploy:
    needs: build-doc
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

